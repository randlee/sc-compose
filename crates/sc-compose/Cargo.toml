[package]
name = "sc-compose"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone CLI for template composition."
readme = "../../README.md"
keywords = ["prompt", "template", "compose", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Enables integration tests that execute the externally installed lint CLI.
external-lint-cli-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
glob.workspace = true
mimalloc = { version = "0.1" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sc-composer = { path = "../sc-composer", version = "1.6.0" }
sc-composer-beads = { path = "../sc-composer-beads", version = "1.6.0" }
sc-observability.workspace = true
sc-observability-types.workspace = true
time.workspace = true
toml.workspace = true
ulid.workspace = true

[lints]
workspace = true

[[test]]
name = "sc_lint_check_native"
path = "tests/sc_lint_check_native.rs"
required-features = ["external-lint-cli-tests"]

[[test]]
name = "sc_lint_check_xwin"
path = "tests/sc_lint_check_xwin.rs"
required-features = ["external-lint-cli-tests"]

[[test]]
name = "sc_lint_ci"
path = "tests/sc_lint_ci.rs"
required-features = ["external-lint-cli-tests"]

[[test]]
name = "sc_lint_clippy_native"
path = "tests/sc_lint_clippy_native.rs"
required-features = ["external-lint-cli-tests"]

[[test]]
name = "sc_lint_clippy_xwin"
path = "tests/sc_lint_clippy_xwin.rs"
required-features = ["external-lint-cli-tests"]

[[test]]
name = "sc_lint_identity_literals"
