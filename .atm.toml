[atm]
default_team = "sc-compose"
identity = "team-lead"

[team."sc-compose"]
co_leaders = ["quality-mgr"]

[[atm.post_send_hooks]]
recipient = "comp"
command = ["scripts/atm-nudge.py", "comp"]

[plugins.gh_monitor]
team = "sc-compose"
repo = "randlee/sc-compose"
notify_target = ["quality-mgr@sc-compose", "team-lead@sc-compose"]
poll_interval_secs = 300

[plugins.atm-agent-mcp]
codex_bin = "codex"
identity = "comp"
sandbox = "workspace-write"
approval_policy = "on-failure"

# ── rmux: pane layout (used by atm-nudge.py for pane resolution) ─────
[rmux]
session = "atm-dev"

[[rmux.windows]]
name = "sc-compose"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
tmux_pane_id = ""
model = "sonnet"
color = "red"
dir = "/Users/randlee/Documents/github/sc-compose"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "comp"
tmux_pane_id = "%66"
command = "codex -c features.codex_hooks=true --yolo"
dir = "/Users/randlee/Documents/github/sc-compose"
env = { ATM_IDENTITY = "comp", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "quality-mgr"
tmux_pane_id = "%67"
model = "sonnet"
color = "red"
dir = "/Users/randlee/Documents/github/sc-compose"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }
