[atm]
default_team = "sc-compose"
identity = "team-lead"

[team."sc-compose"]
co_leaders = ["quality-mgr"]

[plugins.gh_monitor]
team = "sc-compose"
repo = "randlee/sc-compose"
notify_target = ["quality-mgr@sc-compose", "team-lead@sc-compose"]
poll_interval_secs = 300

[plugins.atm-agent-mcp]
codex_bin = "codex"
identity = "comp"
sandbox = "workspace-write"
approval_policy = "on-failure"

[startup.team-lead]
all = ["Your role is lead under atm-bd-orchestration: read .claude/skills/atm-bd-orchestration/SKILL.md (Lead Role and Loop) and .claude/skills/atm-beads/SKILL.md now (again after every compaction); on each Loop pass run .claude/skills/atm-bd-orchestration/scripts/bead-queues --phase <x> and act on every row",
       "Use native atm send or atm ack for messages to comp, comp2, comp3, comp-sanity, or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.quality-mgr]
all = ["read .claude/agents/quality-mgr.md for directive",
       "Your role is quality-mgr under atm-bd-orchestration: read .claude/skills/atm-bd-orchestration/roles/quality-mgr.md now (again after every compaction); where it and quality-mgr.md differ, the role file wins",
       "Use native atm send or atm ack for messages to team-lead, comp, comp2, or comp3",
       "Use native atm read to read messages from team-members" ]

[startup.comp]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.comp2]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.comp3]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

# ── rmux: pane layout ─────
[rmux]
session = "sc-compose"

[[rmux.windows]]
name = "sc-compose"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
alias = "comp-lead"
model = "sonnet"
color = "red"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "comp"
command = "codex -c features.hooks=true --yolo"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "comp", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "quality-mgr"
alias = "quality-mgr-comp"
model = "sonnet"
color = "red"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows]]
name = "dev2"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "comp2"
command = "codex -c features.hooks=true --yolo"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "comp2", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "comp3"
command = "codex -c features.hooks=true --yolo"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "comp3", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[[rmux.windows.panes]]
name = "comp-sanity"
model = "sonnet"
color = "green"
dir = "/Users/randlee/github/sc-compose"
env = { ATM_IDENTITY = "comp-sanity", ATM_TEAM = "sc-compose", CLAUDE_CODE_TASK_LIST_ID = "sc-compose" }

[startup.comp-sanity]
all = ["Your role is dev-sanity under atm-bd-orchestration: read .claude/agents/dev-sanity.md now (again after every compaction) and run its Startup section",
       "Use native atm send or atm ack for messages to team-lead",
       "Use native atm read to read messages from team-members" ]
