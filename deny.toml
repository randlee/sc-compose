[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  # UniFFI 0.31.0 is the approved generated Go-binding runtime (ADR-0020).
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
