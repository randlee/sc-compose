[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Private path dev-dependencies (publish = false test-support) carry no version.
# Registry dependencies keep the wildcard ban.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  # UniFFI 0.31.2 (ADR-0020 Amendment 1) is the approved generated Go-binding runtime.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
