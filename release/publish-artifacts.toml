[project]
name = "sc-compose"
archive_prefix = "sc-compose"
description = "Standalone CLI for template composition"
homepage = "https://github.com/randlee/sc-compose"
license = "MIT"

[[release_targets]]
target = "x86_64-unknown-linux-gnu"
os = "ubuntu-latest"
archive = "tar.gz"

[[release_targets]]
target = "x86_64-apple-darwin"
os = "macos-latest"
archive = "tar.gz"

[[release_targets]]
target = "aarch64-apple-darwin"
os = "macos-latest"
archive = "tar.gz"

[[release_targets]]
target = "x86_64-pc-windows-msvc"
os = "windows-latest"
archive = "zip"

[[crates]]
artifact = "sc-sha"
package = "sc-sha"
cargo_toml = "crates/sc-sha/Cargo.toml"
publish_order = 1
wait_after_publish_seconds = 30

[[crates]]
artifact = "sc-composer"
package = "sc-composer"
cargo_toml = "crates/sc-composer/Cargo.toml"
publish_order = 2
wait_after_publish_seconds = 30

[[crates]]
artifact = "sc-compose"
package = "sc-compose"
cargo_toml = "crates/sc-compose/Cargo.toml"
publish_order = 3
wait_after_publish_seconds = 0

[[release_binaries]]
name = "sc-compose"
bundled_paths = [{ source = "examples", destination = "share/sc-compose/examples" }]

[[python_packages]]
artifact = "sc-sha-python"
package = "sc-sha"
manifest = "bindings/sc-sha-python/pyproject.toml"
module = "sc_sha"
publish = "pypi"

[[python_packages]]
artifact = "sc-compose-python"
package = "sc-compose"
manifest = "bindings/python/pyproject.toml"
module = "sc_compose"
publish = "pypi"

[[python_distributions]]
name = "sc-sha"
source = "bindings/sc-sha-python"
cargo_manifest = "bindings/sc-sha-python/Cargo.toml"
module_path = "bindings/sc-sha-python/python/sc_sha"
sdist = true
wheels = ["ubuntu-latest", "macos-latest", "windows-latest"]

[[python_distributions]]
name = "sc-compose"
source = "bindings/python"
cargo_manifest = "bindings/python/Cargo.toml"
module_path = "bindings/python/python/sc_compose"
sdist = true
wheels = ["ubuntu-latest", "macos-latest", "windows-latest"]

[channels.pypi]
test_repository = "testpypi"
production_repository = "pypi"

[channels.homebrew]
tap_repository = "randlee/homebrew-tap"
formula_path = "Formula/sc-compose.rb"
formula_template = "release/homebrew/formula.rb.j2"
formula_class = "ScCompose"
binary = "sc-compose"
test_command = "--help"
test_output = "Standalone template composition CLI"

[[channels.homebrew.assets]]
key = "macos_arm"
target = "aarch64-apple-darwin"

[[channels.homebrew.assets]]
key = "macos_intel"
target = "x86_64-apple-darwin"

[[channels.homebrew.assets]]
key = "linux"
target = "x86_64-unknown-linux-gnu"

[channels.winget]
identifier = "randlee.sc-compose"
installer_target = "x86_64-pc-windows-msvc"

[channels.scoop]
bucket_repository = "randlee/scoop-bucket"
manifest_path = "sc-compose.json"
manifest_template = "release/scoop/manifest.json.j2"
installer_target = "x86_64-pc-windows-msvc"
binary = "bin/sc-compose.exe"
