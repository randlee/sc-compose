name: Extract published sc-compose renderer
description: Extract and expose the Linux renderer binary from a verified release archive
inputs:
  archive:
    description: Absolute path to the verified published renderer archive
    required: true
  extract-dir:
    description: Expected top-level archive directory containing bin/sc-compose
    required: true
outputs:
  renderer-path:
    description: Absolute path to the extracted sc-compose renderer
    value: ${{ steps.extract.outputs.renderer-path }}
runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      env:
        RENDERER_ARCHIVE: ${{ inputs.archive }}
        RENDERER_EXTRACT_DIR: ${{ inputs.extract-dir }}
      run: |
        set -euo pipefail
        renderer_root="${RUNNER_TEMP}/sc-compose-renderer"
        mkdir -p "${renderer_root}"
        tar -xzf "${RENDERER_ARCHIVE}" -C "${renderer_root}"
        renderer="${renderer_root}/${RENDERER_EXTRACT_DIR}/bin/sc-compose"
        test -x "${renderer}" || {
          echo "Published renderer archive is missing bin/sc-compose" >&2
          exit 1
        }
        echo "renderer-path=${renderer}" >> "$GITHUB_OUTPUT"
        echo "SC_COMPOSE_RENDERER=${renderer}" >> "$GITHUB_ENV"
