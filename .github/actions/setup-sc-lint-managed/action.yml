name: Setup sc-lint (managed)
description: Install the release selected by the repository sc-lint configuration.
inputs:
  repository:
    description: Supported sc-lint release repository.
    required: false
    default: "randlee/sc-lint"
runs:
  using: composite
  steps:
    - name: Validate release repository
      shell: python
      env:
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        import os
        if os.environ['SC_LINT_REPOSITORY'] != 'randlee/sc-lint':
            raise SystemExit('The managed sc-lint installer supports only randlee/sc-lint')
    - name: Install verified sc-lint release
      shell: python
      run: |
        import os
        from pathlib import Path
        import subprocess
        import sys

        install_dir = Path(os.environ['RUNNER_TEMP']) / 'sc-lint' / 'bin'
        env = dict(os.environ, SC_LINT_INSTALL_DIR=str(install_dir))
        env.pop('SC_LINT_BIN', None)
        subprocess.run([sys.executable, '.sc-lint/bootstrap.py', 'setup',
                        '--config', 'sc-lint.toml'], env=env, check=True)
        binary = install_dir / ('sc-lint.exe' if os.name == 'nt' else 'sc-lint')
        if not binary.is_file():
            raise SystemExit('setup succeeded but no sc-lint executable was found')
        with open(env['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
            path_file.write(str(install_dir) + '\n')
