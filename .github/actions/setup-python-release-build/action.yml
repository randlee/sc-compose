name: Prepare Python release build
description: Check out the tagged release and prepare the Python build toolchain.

inputs:
  release_tag:
    description: Release tag to check out.
    required: true
  release_version:
    description: Release version expected in Python metadata.
    required: true
  python_version:
    description: Python version to install.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_tag }}
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.1
    - name: Install maturin
      shell: bash
      run: python -m pip install maturin==1.9.4
    - name: Sync Python package version
      shell: bash
      run: |
        python3 scripts/release_artifacts.py sync-python-version \
          --workspace-toml Cargo.toml \
          --pyproject bindings/python/pyproject.toml
    - name: Verify Python package version
      shell: bash
      run: |
        python3 scripts/release_artifacts.py verify-python-version \
          --workspace-toml Cargo.toml \
          --pyproject bindings/python/pyproject.toml \
          --version '${{ inputs.release_version }}'
