name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit instead of stacking a full matrix behind it.
# Pushes to develop/main are never cancelled (every landed commit gets a run,
# classified by its own change set like a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  manifest-validation:
    name: manifest-validation (ubuntu)
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install consumer test dependencies
        run: python3 -m pip install maturin==1.9.4 pytest PyYAML==6.0.3

      - name: Install Rust toolchain for renderer bindings
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Install and verify pinned sc-docli
        run: |
          cargo install sc-docli --version 0.2.0 --locked
          test "$(docli --version)" = "docli 0.2.0"

      - name: Build and install sc-compose renderer bindings
        run: |
          maturin build --manifest-path bindings/python/Cargo.toml --out "$RUNNER_TEMP/sc-compose-wheel"
          python3 -m pip install "$RUNNER_TEMP"/sc-compose-wheel/*.whl

      - name: Validate manifest completeness
        run: |
          python3 .github/scripts/release_artifacts.py validate-manifest \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Verify release version lockstep
        run: |
          python3 .github/scripts/release_artifacts.py verify-version-lockstep \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml
          python3 .github/scripts/go_native_module.py verify-version-lockstep \
            --config release/go-native-module.toml \
            --workspace-toml Cargo.toml

      - name: Run publish-kit regression tests
        run: python3 -m pytest .github/scripts/tests

      # Root tests cover these identical vendored implementations. Fail on drift
      # rather than executing the same behavioral suite a second time.
      - name: Verify vendored publish-plugin coverage parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.github/scripts')
          plugin = Path('plugins/sc-publish/.github/scripts')
          for source in plugin.rglob('*.py'):
              relative = source.relative_to(plugin)
              if relative.as_posix() == 'tests/test_setup_sc_lint_source.py':
                  continue  # Root has an additional host-workflow assertion.
              installed = root / relative
              assert installed.read_bytes() == source.read_bytes(), f'vendored coverage drift: {relative}'
          action = Path('.github/actions/setup-sc-lint/action.yml')
          assert action.read_bytes() == (Path('plugins/sc-publish') / action).read_bytes()
          PY

      - name: Run CLI reference and consumer preflight tests
        run: python3 -m unittest discover -s scripts/tests -p test_generate_cli_reference.py

      - name: Verify generated CLI reference is current
        run: python3 scripts/generate_cli_reference.py --check --install-docli

      - name: Verify vendored Homebrew template tracks sc-publish
        shell: bash
        run: |
          set -euo pipefail
          # PR #85 contains this already-validated template fix. Until it
          # merges, accept only its exact template as the authorized ahead-of-
          # upstream state; after merge, the develop comparison wins again.
          git fetch --depth=1 https://github.com/randlee/sc-publish.git \
            refs/heads/develop:refs/remotes/sc-publish-upstream/develop
          git fetch --depth=1 https://github.com/randlee/sc-publish.git \
            refs/pull/85/head:refs/remotes/sc-publish-upstream/pr-85
          template=plugins/sc-publish/release/homebrew/formula.rb.j2
          if git diff --quiet sc-publish-upstream/develop -- "${template}"; then
            exit 0
          fi
          if git diff --quiet sc-publish-upstream/pr-85 -- "${template}"; then
            echo "vendored Homebrew template matches the authorized sc-publish PR #85 fix"
            exit 0
          fi
          echo "vendored Homebrew template diverges from both sc-publish develop and PR #85" >&2
          git diff sc-publish-upstream/develop -- "${template}" >&2
          exit 1

      - name: Validate publish-order dependency graph
        run: |
          python3 .github/scripts/release_artifacts.py validate-publish-order \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

  test:
    needs: [clippy, manifest-validation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for cross-platform test helpers
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up lint toolchain
        uses: ./.github/actions/setup-lint-toolchain
        with:
          cargo-shear-version: "1.12.0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # The managed installer forces CARGO_HOME to $RUNNER_TEMP/sc-lint/cargo-home
      # (.github/scripts/setup_sc_lint_managed.py), so that directory, not
      # ~/.cargo, holds the registry, git checkouts and the pinned cargo tools.
      # Restore it before the installer; the installer still verifies every
      # declared tool version on a cache hit.
      - name: Cache managed Cargo home
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sc-lint/cargo-home
          key: ${{ runner.os }}-${{ runner.arch }}-managed-cargo-home-rust-1.94.1-${{ hashFiles('.sc-lint/install.json') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-managed-cargo-home-rust-1.94.1-${{ hashFiles('.sc-lint/install.json') }}-

      - name: Install pinned sc-lint
        uses: ./.github/actions/setup-sc-lint-managed

      - id: beads
        name: Install pinned Beads
        uses: ./.github/actions/setup-beads

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --workspace --features sc-compose/external-lint-cli-tests
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}

      - name: Set up Go for release-layout fixtures
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/sc-sha-go/go.mod
          cache: false

      - name: Run controlled Go release-layout fixtures
        run: python3 bindings/sc-sha-go/tests/test_release_layout.py

      - name: Run real-bd qualification (ignored tests; fails if bd is absent)
        run: python3 scripts/test_real_bd.py
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run shared sc-lint contract
        run: just lint full

      - name: Publish sc-lint report and raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-lint-${{ matrix.os }}
          path: reports/latest/sc-lint/
          if-no-files-found: warn

  linux-arm64-release-validation:
    needs: [clippy, manifest-validation]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-unknown-linux-gnu

      - id: beads
        name: Install pinned Beads
        uses: ./.github/actions/setup-beads

      - name: Run workspace tests
        # setup-sc-lint has no Linux ARM64 release. Cargo's feature-gated test
        # targets keep its CLI-dependent integration tests in the lint-bearing
        # matrix while this job exercises every remaining workspace test natively.
        run: cargo test --workspace
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}

      - name: Run real-bd qualification (ignored tests; fails if bd is absent)
        run: python3 scripts/test_real_bd.py
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}

      - name: Build and smoke-test native ARM64 CLI archive target
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu -p sc-compose
          target/aarch64-unknown-linux-gnu/release/sc-compose --help

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ARM64 wheel build tooling
        run: python -m pip install 'maturin[zig]==1.9.4' pytest

      - name: Build, install, and verify ARM64 manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          maturin build --release --manifest-path bindings/python/Cargo.toml --out dist --compatibility manylinux2014 --zig
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          case "${wheel}" in
            *manylinux2014_aarch64*.whl) ;;
            *)
              echo "expected an aarch64 manylinux2014 wheel, found: ${wheel:-none}" >&2
              exit 1
              ;;
          esac
          python -m pip install --force-reinstall "${wheel}"
          (cd bindings/python && python -m pytest tests/test_smoke.py)

  python-wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Install build tooling
        run: python -m pip install maturin==1.9.4 pytest

      - name: Sync Python package version
        run: |
          python .github/scripts/release_artifacts.py sync-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/python/pyproject.toml
        shell: bash

      - name: Verify Python package version
        run: |
          python .github/scripts/release_artifacts.py verify-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/python/pyproject.toml \
            --version "$(python -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
        shell: bash

      - name: Build wheel
        run: maturin build --manifest-path bindings/python/Cargo.toml --out dist

      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run Python smoke tests
        working-directory: bindings/python
        run: python -m pytest tests/test_smoke.py

  sc-sha-python-wheels:
    name: sc-sha-python wheel (${{ matrix.os }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Install build tooling
        run: python -m pip install maturin==1.9.4 pytest

      - name: Verify sc-sha Python package version
        run: |
          python .github/scripts/release_artifacts.py verify-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/sc-sha-python/pyproject.toml \
            --version "$(python -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
        shell: bash

      - name: Build sc-sha wheel
        run: maturin build --manifest-path bindings/sc-sha-python/Cargo.toml --out dist

      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run sc-sha Python tests
        working-directory: bindings/sc-sha-python
        run: python -m pytest -q tests

  sc-composer-beads-python-wheels:
    name: sc-composer-beads Python wheel (${{ matrix.os }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - id: beads
        name: Install pinned Beads
        uses: ./.github/actions/setup-beads

      - name: Install build tooling
        run: python -m pip install maturin==1.9.4 pytest

      - name: Verify Beads Python package version
        run: |
          python .github/scripts/release_artifacts.py verify-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/sc-composer-beads-python/pyproject.toml \
            --version "$(python -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
        shell: bash

      - name: Build Beads wheel
        run: |
          maturin build --manifest-path bindings/sc-composer-beads-python/Cargo.toml --out dist
          maturin sdist --manifest-path bindings/sc-composer-beads-python/Cargo.toml --out dist

      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run Beads Python tests
        working-directory: bindings/sc-composer-beads-python
        run: python -m pytest -q tests
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}
          SC_COMPOSER_BEADS_ARTIFACT_DIR: ${{ github.workspace }}/dist

      - name: Run installed-wheel attach integration
        working-directory: bindings/sc-composer-beads-python
        run: python -m pytest -q tests/test_attach_e2e.py
        env:
          BD_EXECUTABLE: ${{ steps.beads.outputs.bd-path }}

  sc-sha-go-generated:
    name: Generate shared sc-sha Go bindings
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Cache pinned UniFFI scaffolding generator
        id: uniffi-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-cli-0.31.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned UniFFI scaffolding generator
        if: steps.uniffi-cli-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi --version '=0.31.2' --features cli --bin uniffi-bindgen --locked
      - name: Verify generated Rust scaffolding
        run: python3 scripts/generate_sc_sha_scaffolding.py --mode check
      - name: Cache pinned UniFFI Go generator
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-go
          key: uniffi-bindgen-go-v0.7.1-v0.31.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install_uniffi_bindgen_go.py') }}
      - name: Generate Go bindings
        run: |
          python3 .github/scripts/install_uniffi_bindgen_go.py
          uniffi-bindgen-go --out-dir bindings/sc-sha-go/go --config bindings/sc-sha-go/uniffi.toml bindings/sc-sha-go/src/sc_sha_go.udl
      - name: Test pinned UniFFI Go generator installer
        shell: bash
        run: cd .github/scripts && python3 -m unittest test_install_uniffi_bindgen_go -v
      - name: Verify generated bindings
        run: git diff --exit-code -- bindings/sc-sha-go/go
