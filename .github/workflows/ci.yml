name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*"]
  push:
    branches: [develop, main]

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  manifest-validation:
    name: manifest-validation (ubuntu)
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python3 -m pip install maturin==1.9.4 pytest

      - name: Install Rust toolchain for renderer bindings
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Build and install sc-compose renderer bindings
        run: |
          maturin build --manifest-path bindings/python/Cargo.toml --out "$RUNNER_TEMP/sc-compose-wheel"
          python3 -m pip install "$RUNNER_TEMP"/sc-compose-wheel/*.whl

      - name: Validate manifest completeness
        run: |
          python3 .github/scripts/release_artifacts.py validate-manifest \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Verify release version lockstep
        run: |
          python3 .github/scripts/release_artifacts.py verify-version-lockstep \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Run publish-kit regression tests
        run: python3 -m pytest .github/scripts/tests

      - name: Validate publish_order dependency graph
        run: bash scripts/ci/validate_publish_order.sh

  test:
    needs: [clippy, manifest-validation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up lint toolchain
        uses: ./.github/actions/setup-lint-toolchain

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-test-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-test-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run shared sc-lint contract
        # sc-lint 0.4.0's full/ci profile still runs source-tree Cargo wrappers
        # for boundary/portability. Use native targets until sc-lint#84 lands.
        run: just lint-ci-consumer

      - name: Publish sc-lint report and raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-lint-${{ matrix.os }}
          path: reports/latest/sc-lint/
          if-no-files-found: warn

  python-wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Install build tooling
        run: python -m pip install maturin==1.9.4 pytest

      - name: Sync Python package version
        run: |
          python .github/scripts/release_artifacts.py sync-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/python/pyproject.toml
        shell: bash

      - name: Verify Python package version
        run: |
          python .github/scripts/release_artifacts.py verify-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/python/pyproject.toml \
            --version "$(python -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
        shell: bash

      - name: Build wheel
        run: maturin build --manifest-path bindings/python/Cargo.toml --out dist

      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run Python smoke tests
        working-directory: bindings/python
        run: python -m pytest tests/test_smoke.py

  sc-sha-python-wheels:
    name: sc-sha-python wheel (${{ matrix.os }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Install build tooling
        run: python -m pip install maturin==1.9.4 pytest

      - name: Verify sc-sha Python package version
        run: |
          python .github/scripts/release_artifacts.py verify-python-version \
            --workspace-toml Cargo.toml \
            --pyproject bindings/sc-sha-python/pyproject.toml \
            --version "$(python -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
        shell: bash

      - name: Build sc-sha wheel
        run: maturin build --manifest-path bindings/sc-sha-python/Cargo.toml --out dist

      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run sc-sha Python tests
        working-directory: bindings/sc-sha-python
        run: python -m pytest -q tests

  sc-sha-go-plan:
    name: sc-sha Go native target plan
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        name: Read Go native target matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "target_matrix=$(python3 .github/scripts/release_artifacts.py go-native-target-matrix --manifest release/publish-artifacts.toml)" >> "$GITHUB_OUTPUT"

  sc-sha-go-generated:
    name: Generate shared sc-sha Go bindings
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Cache generated Go bindings
        id: generated-cache
        uses: actions/cache@v4
        with:
          path: bindings/sc-sha-go/go
          key: uniffi-bindgen-go-generated-v0.7.1-v0.31.0-${{ hashFiles('bindings/sc-sha-go/src/sc_sha_go.udl', 'bindings/sc-sha-go/uniffi.toml') }}
      - name: Generate bindings on Ubuntu when cache misses
        if: steps.generated-cache.outputs.cache-hit != 'true'
        run: |
          python3 .github/scripts/install_uniffi_bindgen_go.py
          uniffi-bindgen-go --out-dir bindings/sc-sha-go/go --config bindings/sc-sha-go/uniffi.toml bindings/sc-sha-go/src/sc_sha_go.udl
      - name: Test pinned UniFFI Go generator installer
        shell: bash
        run: cd .github/scripts && python3 -m unittest test_install_uniffi_bindgen_go -v
      - name: Verify generated bindings
        run: git diff --exit-code -- bindings/sc-sha-go/go
      - name: Upload generated Go bindings
        uses: actions/upload-artifact@v4
        with:
          name: sc-sha-go-generated
          path: bindings/sc-sha-go/go

  sc-sha-go:
    name: sc-sha Go bundle (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [sc-sha-go-plan, sc-sha-go-generated]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sc-sha-go-plan.outputs.target_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download generated Go bindings
        uses: actions/download-artifact@v4
        with:
          name: sc-sha-go-generated
          path: bindings/sc-sha-go/go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Build the target-native static adapter
        run: cargo build --release -p sc-sha-go --target ${{ matrix.target }}

      - name: Stage the self-contained Go module bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
          library="target/${{ matrix.target }}/release/libsc_sha_go.a"
          bundle="$RUNNER_TEMP/sc-sha-go-${{ matrix.target }}"
          python3 .github/scripts/release_artifacts.py stage-go-native-module \
            --manifest release/publish-artifacts.toml \
            --target '${{ matrix.target }}' \
            --native-library "$library" \
            --output "$bundle" \
            --version "$version"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run bundled Go conformance tests
        working-directory: ${{ steps.bundle.outputs.path }}
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Run an independent Go consumer module
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/sc-sha-go-consumer"
          cp -R bindings/sc-sha-go/tests/consumer-module "$consumer"
          cd "$consumer"
          module='github.com/randlee/sc-compose/bindings/sc-sha-go'
          go mod edit -replace "$module=${{ steps.bundle.outputs.path }}"
          go get "$module/go/sc_sha_go@v${{ steps.bundle.outputs.version }}"
          CGO_ENABLED=1 go run .

      - name: Verify downloaded release bundle contract
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ steps.bundle.outputs.path }}"
          archive="$RUNNER_TEMP/sc-sha-go-${{ matrix.target }}.zip"
          downloaded="$RUNNER_TEMP/sc-sha-go-downloaded-${{ matrix.target }}"
          python3 - "$bundle" "$archive" "$downloaded/module" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source, archive, destination = map(Path, sys.argv[1:])
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for path in source.rglob("*"):
                  if path.is_file():
                      output.write(path, path.relative_to(source))
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as payload:
              payload.extractall(destination)
          PY
          (cd "$downloaded/module" && CGO_ENABLED=1 go test ./...)
          consumer="$RUNNER_TEMP/sc-sha-go-downloaded-consumer-${{ matrix.target }}"
          cp -R bindings/sc-sha-go/tests/consumer-module "$consumer"
          cd "$consumer"
          module='github.com/randlee/sc-compose/bindings/sc-sha-go'
          go mod edit -replace "$module=$downloaded/module"
          go get "$module/go/sc_sha_go@v${{ steps.bundle.outputs.version }}"
          CGO_ENABLED=1 go run .

      - name: Verify release-layout contract
        run: python3 bindings/sc-sha-go/tests/test_release_layout.py
