name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version candidate (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      run_by_agent:
        description: "Must be 'publisher' (agent ownership assertion)"
        required: true
        default: "publisher"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce publisher ownership input
        shell: bash
        run: |
          set -euo pipefail
          runner='${{ github.event.inputs.run_by_agent }}'
          if [[ "$runner" != "publisher" ]]; then
            echo "Preflight must be executed by publisher agent. Got run_by_agent='$runner'" >&2
            exit 1
          fi

      - id: secret-plan
        name: Read non-disclosing credential plan from release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "plan=$(python3 scripts/release_artifacts.py preflight-secret-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")" >> "$GITHUB_OUTPUT"

      - name: Verify required release secrets are available
        shell: bash
        env:
          SECRET_PLAN: ${{ steps.secret-plan.outputs.plan }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r secret_name; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("${secret_name}")
            fi
          done < <(jq -r '.repository_secrets[]' <<<"${SECRET_PLAN}")
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing required GitHub Actions release secret(s): ${missing[*]}" >&2
            exit 1
          fi
          echo "All manifest-required repository secrets are available."

      - name: Verify protected Python environment secret metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SECRET_PLAN: ${{ steps.secret-plan.outputs.plan }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r environment_name secret_name; do
            if ! names="$(gh api "repos/${REPOSITORY}/environments/${environment_name}/secrets" --jq '.secrets[].name')"; then
              echo "Could not inspect secret metadata for protected environment ${environment_name}." >&2
              exit 1
            fi
            if ! grep -Fxq -- "${secret_name}" <<<"${names}"; then
              echo "GitHub Actions environment ${environment_name} is missing required secret ${secret_name}." >&2
              exit 1
            fi
          done < <(jq -r '.environment_secrets[] | [.environment, .name] | @tsv' <<<"${SECRET_PLAN}")
          echo "All manifest-required protected-environment secret names are present."

      - name: Verify repository credential liveness
        shell: bash
        env:
          SECRET_PLAN: ${{ steps.secret-plan.outputs.plan }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r secret_name check_kind; do
            token="${!secret_name:-}"
            case "${check_kind}" in
              crates_io)
                command=(curl --fail --silent --show-error --header "Authorization: ${token}" https://crates.io/api/v1/me)
                ;;
              github)
                command=(curl --fail --silent --show-error --header "Authorization: Bearer ${token}" --header "Accept: application/vnd.github+json" https://api.github.com/user)
                ;;
              *)
                echo "Unsupported credential liveness check kind: ${check_kind}" >&2
                exit 1
                ;;
            esac
            if ! "${command[@]}" >/dev/null; then
              echo "GitHub Actions secret ${secret_name} is present but rejected by its publish service; rotate or replace it." >&2
              exit 1
            fi
          done < <(jq -r '.liveness_checks[] | [.name, .kind] | @tsv' <<<"${SECRET_PLAN}")
          echo "All manifest-required repository credentials are accepted by their publish services."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up lint toolchain
        uses: ./.github/actions/setup-lint-toolchain

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Validate manifest completeness
        run: |
          python3 scripts/release_artifacts.py validate-manifest \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Validate publish_order dependency graph
        run: bash scripts/ci/validate_publish_order.sh

      - name: Verify release helper files exist
        run: |
          test -f scripts/release_gate.sh
          test -f docs/publishing-agent.md

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Verify release version lockstep
        run: |
          python3 scripts/release_artifacts.py verify-version-lockstep \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Verify release version is unpublished on crates.io
        run: |
          python3 scripts/release_artifacts.py check-version-unpublished \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Run dependency-aware package checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r package _; do
            cargo package -p "$package" --locked --allow-dirty
          done < <(python3 scripts/release_artifacts.py list-publish-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")
