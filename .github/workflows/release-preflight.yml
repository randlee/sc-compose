name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version candidate (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      run_by_agent:
        description: "Must be 'publisher' (agent ownership assertion)"
        required: true
        default: "publisher"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml
    steps:
      - name: Enforce publisher ownership input
        shell: bash
        run: |
          set -euo pipefail
          runner='${{ github.event.inputs.run_by_agent }}'
          if [[ "$runner" != "publisher" ]]; then
            echo "Preflight must be executed by publisher agent. Got run_by_agent='$runner'" >&2
            exit 1
          fi

      - name: Verify standardized release secrets are available
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in \
            CARGO_REGISTRY_TOKEN \
            HOMEBREW_TAP_TOKEN \
            SCOOP_BUCKET_TOKEN \
            WINGET_GITHUB_TOKEN; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("${secret_name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Missing required GitHub Actions release secret(s): ${missing[*]}" >&2
            exit 1
          fi
          echo "All standardized release secrets are available."

      - name: Verify Python environment secret metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          check_environment_secret() {
            local environment_name="$1"
            local expected_secret="$2"
            local names
            if ! names="$(gh api "repos/${REPOSITORY}/environments/${environment_name}/secrets" --jq '.secrets[].name')"; then
              echo "Could not inspect secret metadata for environment ${environment_name}." >&2
              exit 1
            fi
            if ! grep -Fxq -- "$expected_secret" <<<"$names"; then
              echo "GitHub Actions environment ${environment_name} is missing required secret ${expected_secret}." >&2
              exit 1
            fi
          }
          check_environment_secret pypi PYPI_API_TOKEN
          check_environment_secret testpypi TEST_PYPI_API_TOKEN
          echo "Required Python environment secrets are present."

      - name: Verify GitHub channel token liveness
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for secret_name in HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN WINGET_GITHUB_TOKEN; do
            if ! curl --fail --silent --show-error \
              --header "Authorization: Bearer ${!secret_name}" \
              --header "Accept: application/vnd.github+json" \
              https://api.github.com/user >/dev/null; then
              echo "GitHub Actions secret ${secret_name} is present but rejected by GitHub; rotate or replace it." >&2
              exit 1
            fi
          done
          echo "GitHub channel tokens are accepted by GitHub."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up lint toolchain
        uses: ./.github/actions/setup-lint-toolchain

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Validate manifest completeness
        run: |
          python3 scripts/release_artifacts.py validate-manifest \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Validate publish_order dependency graph
        run: bash scripts/ci/validate_publish_order.sh

      - name: Verify release helper files exist
        run: |
          test -f scripts/release_gate.sh
          test -f docs/publishing-agent.md

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Verify release version lockstep
        run: |
          python3 scripts/release_artifacts.py verify-version-lockstep \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Verify release version is unpublished on crates.io
        run: |
          python3 scripts/release_artifacts.py check-version-unpublished \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Run dependency-aware package checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r package _; do
            cargo package -p "$package" --locked --allow-dirty
          done < <(python3 scripts/release_artifacts.py list-publish-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")
