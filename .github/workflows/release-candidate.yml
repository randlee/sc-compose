name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      run_by_agent:
        description: "Must be 'publisher' (agent ownership assertion)"
        required: true
        default: "publisher"
        type: string

permissions:
  contents: write

jobs:
  establish-provenance:
    runs-on: ubuntu-latest
    outputs:
      release_candidate_tag: ${{ steps.candidate.outputs.tag }}
      release_candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce publisher ownership input
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ github.event.inputs.run_by_agent }}' == 'publisher' ]] \
            || { echo "Release candidate must be created by publisher." >&2; exit 1; }

      - id: candidate
        name: Reuse or create release-candidate tag from develop
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          release_tag="$raw"
          [[ "$release_tag" == v* ]] || release_tag="v${release_tag}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2; exit 1; }
          candidate_tag="release-candidate-${release_tag}"

          git fetch origin develop --prune --tags
          develop_sha="$(git rev-parse origin/develop)"
          if git rev-parse --verify "refs/tags/${candidate_tag}" >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse "${candidate_tag}^{commit}")"
            git merge-base --is-ancestor "${candidate_tag}" origin/develop \
              || { echo "${candidate_tag} is not an ancestor of origin/develop" >&2; exit 1; }
            echo "Reusing ${candidate_tag} at ${candidate_sha}; origin/develop is ${develop_sha}."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${candidate_tag}" origin/develop -m "Release candidate ${release_tag}"
            git push origin "refs/tags/${candidate_tag}"
            candidate_sha="${develop_sha}"
            echo "Created ${candidate_tag} at origin/develop (${candidate_sha})."
          fi
          {
            echo "tag=${candidate_tag}"
            echo "sha=${candidate_sha}"
          } >> "$GITHUB_OUTPUT"

  python-compat:
    needs: establish-provenance
    name: python-compat (${{ matrix.os }}, ${{ needs.establish-provenance.outputs.release_candidate_sha }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: {"include":[{"os":"macos-15","runner":"macos-15","versions":"[\"3.9\", \"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"},{"os":"macos-15-intel","runner":"macos-15-intel","versions":"[\"3.9\", \"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"},{"os":"ubuntu-24.04-arm","runner":"ubuntu-24.04-arm","versions":"[\"3.9\", \"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"},{"os":"ubuntu-latest","runner":"ubuntu-24.04","versions":"[\"3.9\", \"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"},{"os":"windows-11-arm","runner":"windows-11-arm","versions":"[\"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"},{"os":"windows-latest","runner":"windows-latest","versions":"[\"3.9\", \"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]"}]}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.establish-provenance.outputs.release_candidate_sha }}
      - id: build_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Set up declared compatibility build tools
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py setup"
      - name: Build candidate wheels once
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py build"
      - name: Set up Python 3.9
        if: ${{ contains(fromJSON(matrix.versions), '3.9') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Smoke-test wheels on Python 3.9
        if: ${{ contains(fromJSON(matrix.versions), '3.9') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
      - name: Set up Python 3.11
        if: ${{ contains(fromJSON(matrix.versions), '3.11') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Smoke-test wheels on Python 3.11
        if: ${{ contains(fromJSON(matrix.versions), '3.11') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
      - name: Set up Python 3.12
        if: ${{ contains(fromJSON(matrix.versions), '3.12') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Smoke-test wheels on Python 3.12
        if: ${{ contains(fromJSON(matrix.versions), '3.12') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
      - name: Set up Python 3.13
        if: ${{ contains(fromJSON(matrix.versions), '3.13') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Smoke-test wheels on Python 3.13
        if: ${{ contains(fromJSON(matrix.versions), '3.13') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
      - name: Set up Python 3.14
        if: ${{ contains(fromJSON(matrix.versions), '3.14') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Smoke-test wheels on Python 3.14
        if: ${{ contains(fromJSON(matrix.versions), '3.14') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
      - name: Set up Python 3.15
        if: ${{ contains(fromJSON(matrix.versions), '3.15') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Smoke-test wheels on Python 3.15
        if: ${{ contains(fromJSON(matrix.versions), '3.15') }}
        shell: bash
        run: "\"${{ steps.build_python.outputs.python-path }}\" .github/scripts/rc_python_compatibility.py smoke"
