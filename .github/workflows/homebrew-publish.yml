name: Publish Homebrew

# Rebuild the formula from immutable GitHub Release assets. This recovery path
# never creates or changes release tags and can be re-run after a tap failure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub Release tag to publish (e.g. v1.4.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-homebrew-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ inputs.tag }}
          asset_patterns: |
            ^sc-compose_.*_aarch64-apple-darwin\.tar\.gz$
            ^sc-compose_.*_x86_64-apple-darwin\.tar\.gz$
            ^sc-compose_.*_x86_64-unknown-linux-gnu\.tar\.gz$
      - id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  update-tap:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: sc-compose
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: randlee/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Compute release tarball SHA256
        id: sha
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          declare -A targets=(
            [macos_arm]='aarch64-apple-darwin'
            [macos_intel]='x86_64-apple-darwin'
            [linux]='x86_64-unknown-linux-gnu'
          )

          for key in "${!targets[@]}"; do
            target="${targets[$key]}"
            tarball_path="${RUNNER_TEMP:?RUNNER_TEMP is required}/${target}.tar.gz"
            tarball_url="https://github.com/randlee/sc-compose/releases/download/${RELEASE_TAG}/sc-compose_${RELEASE_VERSION}_${target}.tar.gz"
            echo "${key}_url=${tarball_url}" >> "$GITHUB_OUTPUT"
            curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "${tarball_path}" "${tarball_url}"
            sha256="$(sha256sum "${tarball_path}" | awk '{print $1}')"
            echo "${key}_sha256=${sha256}" >> "$GITHUB_OUTPUT"
          done
      - name: Write formula from immutable release template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          template = Path("sc-compose/release/homebrew/sc-compose.rb.j2").read_text()
          rendered = (
              template
              .replace("{{ macos_arm_url }}", os.environ["MACOS_ARM_URL"])
              .replace("{{ macos_arm_sha256 }}", os.environ["MACOS_ARM_SHA256"])
              .replace("{{ macos_intel_url }}", os.environ["MACOS_INTEL_URL"])
              .replace("{{ macos_intel_sha256 }}", os.environ["MACOS_INTEL_SHA256"])
              .replace("{{ linux_url }}", os.environ["LINUX_URL"])
              .replace("{{ linux_sha256 }}", os.environ["LINUX_SHA256"])
              .replace("{{ version }}", os.environ["VERSION"])
          )
          Path(os.environ["FORMULA"]).write_text(rendered)
          PY
        env:
          FORMULA: homebrew-tap/Formula/sc-compose.rb
          LINUX_SHA256: ${{ steps.sha.outputs.linux_sha256 }}
          LINUX_URL: ${{ steps.sha.outputs.linux_url }}
          MACOS_ARM_SHA256: ${{ steps.sha.outputs.macos_arm_sha256 }}
          MACOS_ARM_URL: ${{ steps.sha.outputs.macos_arm_url }}
          MACOS_INTEL_SHA256: ${{ steps.sha.outputs.macos_intel_sha256 }}
          MACOS_INTEL_URL: ${{ steps.sha.outputs.macos_intel_url }}
          VERSION: ${{ needs.verify-release.outputs.release_version }}
      - name: Verify formula syntax
        run: ruby -c homebrew-tap/Formula/sc-compose.rb
      - name: Commit and push formula update
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/sc-compose.rb
          git diff --cached --quiet && echo 'Formula already matches the release assets' && exit 0
          git commit -m "chore: bump sc-compose to v${RELEASE_VERSION}"
          git push
