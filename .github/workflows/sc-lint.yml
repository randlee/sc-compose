name: sc-lint
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  sc-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install LLVM archive tool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          command -v llvm-lib
      - uses: ./plugins/sc-lint/.github/actions/setup-sc-lint
        with:
          config: sc-lint.toml
      - run: just setup
      - run: just lint ci all
        if: runner.os == 'Linux'
      - run: just lint ci
        if: runner.os != 'Linux'
      - run: just test
