name: sc-lint
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  sc-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-sc-lint-managed
      - run: just setup
      - name: Install LLVM for Windows cross compilation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm-18=1:18.1.3-1ubuntu1
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          test -x /usr/lib/llvm-18/bin/llvm-lib
          /usr/lib/llvm-18/bin/llvm-ar --version
      - name: Check both Windows architectures
        if: runner.os == 'Linux'
        env:
          PYO3_CROSS_PYTHON_VERSION: '3.11'
        run: |
          command -v llvm-lib
          cargo xwin check --workspace --target x86_64-pc-windows-msvc
          cargo xwin check --workspace --target aarch64-pc-windows-msvc
      - run: just lint ci all
        if: runner.os == 'Linux'
      - run: just lint ci
        if: runner.os != 'Linux'
      - run: just test
