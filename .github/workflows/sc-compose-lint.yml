name: sc-lint
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  sc-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install verified sc-lint release
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          install_dir = Path(os.environ['RUNNER_TEMP']) / 'sc-lint' / 'bin'
          env = dict(os.environ, SC_LINT_INSTALL_DIR=str(install_dir))
          env.pop('SC_LINT_BIN', None)
          subprocess.run([sys.executable, '.sc-lint/bootstrap.py', 'setup',
                          '--config', 'sc-lint.toml'], env=env, check=True)
          binary = install_dir / ('sc-lint.exe' if os.name == 'nt' else 'sc-lint')
          if not binary.is_file():
              raise SystemExit('setup succeeded but no sc-lint executable was found')
          with open(env['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
              path_file.write(str(install_dir) + '\n')
      - run: just setup
      - name: Install LLVM for Windows cross compilation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm-18=1:18.1.3-1ubuntu1
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          test -x /usr/lib/llvm-18/bin/llvm-lib
          /usr/lib/llvm-18/bin/llvm-ar --version
      - name: Check both Windows architectures
        if: runner.os == 'Linux'
        env:
          PYO3_CROSS_PYTHON_VERSION: '3.11'
        run: |
          command -v llvm-lib
          cargo xwin check --workspace --target x86_64-pc-windows-msvc
          cargo xwin check --workspace --target aarch64-pc-windows-msvc
      - run: just lint ci all
        if: runner.os == 'Linux'
      - run: just lint ci
        if: runner.os != 'Linux'
      - run: just test
