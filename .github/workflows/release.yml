name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      target:
        description: "Release target"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - production

permissions:
  contents: write

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  gate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_target: ${{ steps.meta.outputs.release_target }}
      release_ref: ${{ steps.release-ref.outputs.release_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          target='${{ github.event.inputs.target }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          if [[ "$target" != "testpypi" && "$target" != "production" ]]; then
            echo "Invalid target: '$target' (expected testpypi or production)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release_target=$target" >> "$GITHUB_OUTPUT"

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Verify release version lockstep
        run: python3 scripts/release_artifacts.py verify-version-lockstep --workspace-toml Cargo.toml

      - name: Run release gate
        run: scripts/release_gate.sh origin/main origin/develop '${{ steps.meta.outputs.release_version }}' "${RELEASE_ARTIFACT_MANIFEST}"

      - name: Ensure tag is correct or create it
        id: release-ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune --tags
          tag='${{ steps.meta.outputs.release_tag }}'
          target='${{ steps.meta.outputs.release_target }}'
          main_sha="$(git rev-parse origin/main)"
          if [[ "$target" == "production" ]]; then
            remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}' || true)"
            if [[ -n "$remote_tag_sha" ]]; then
              if [[ "$remote_tag_sha" == "$main_sha" ]]; then
                echo "Tag ${tag} already exists and points to origin/main (${main_sha}), skipping creation"
                echo "release_ref=$tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag ${tag} exists but points to ${remote_tag_sha}, not origin/main (${main_sha})" >&2
              exit 1
            fi
            git tag "$tag" origin/main
            git push origin "$tag"
            echo "release_ref=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Rehearsal mode: validating release tag ${tag} locally only; not pushing any tag to origin"
          echo "release_ref=$main_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: gate-and-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Ensure cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          bin_args="$(python3 scripts/release_artifacts.py cargo-build-bin-args --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          cargo build --release --target ${{ matrix.target }} ${bin_args}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.gate-and-tag.outputs.release_version }}'
          ARCHIVE="sc-compose_${VERSION}_${{ matrix.target }}.tar.gz"
          STAGE="sc-compose_${VERSION}_${{ matrix.target }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/share/sc-compose"
          cp "target/${{ matrix.target }}/release/sc-compose" "$STAGE/bin/"
          cp -R examples "$STAGE/share/sc-compose/examples"
          tar czf "$ARCHIVE" "$STAGE"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = '${{ needs.gate-and-tag.outputs.release_version }}'
          $ARCHIVE = "sc-compose_${VERSION}_${{ matrix.target }}.zip"
          $STAGE = "sc-compose_${VERSION}_${{ matrix.target }}"
          if (Test-Path $STAGE) { Remove-Item -Recurse -Force $STAGE }
          New-Item -ItemType Directory -Force -Path "$STAGE/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$STAGE/share/sc-compose" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sc-compose.exe" "$STAGE/bin/sc-compose.exe"
          Copy-Item -Recurse "examples" "$STAGE/share/sc-compose/examples"
          Compress-Archive -Path $STAGE -DestinationPath $ARCHIVE
          echo "ARCHIVE=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish:
    if: ${{ needs.gate-and-tag.outputs.release_target == 'production' }}
    needs: gate-and-tag
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish crates in order (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.gate-and-tag.outputs.release_version }}'

          crate_exists() {
            local crate="$1"
            local version="$2"
            cargo search "$crate" --limit 1 | grep -F "${crate} = \"${version}\"" >/dev/null
          }

          publish_if_missing() {
            local crate="$1"
            local wait_seconds="${2:-0}"
            if crate_exists "$crate" "$version"; then
              echo "${crate} ${version} already published; skipping"
              return 0
            fi
            cargo publish -p "$crate" --locked
            if [[ "$wait_seconds" != "0" ]]; then
              sleep "$wait_seconds"
            fi
          }

          while IFS='|' read -r package wait_secs; do
            publish_if_missing "$package" "${wait_secs:-0}"
          done < <(python3 scripts/release_artifacts.py list-publish-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")

  build-python-wheels:
    needs: gate-and-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.release_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
      - name: Build wheels
        run: maturin build --release --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: dist/*.whl

  build-python-sdist:
    needs: gate-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.release_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
      - name: Build sdist
        run: maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  build-sc-sha-python-wheels:
    needs: gate-and-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.release_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
          pyproject: bindings/sc-sha-python/pyproject.toml
      - name: Build sc-sha wheels
        run: maturin build --release --manifest-path bindings/sc-sha-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sc-sha-python-wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sc-sha-python-sdist:
    needs: gate-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_ref }}
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.gate-and-tag.outputs.release_ref }}
          release_version: ${{ needs.gate-and-tag.outputs.release_version }}
          pyproject: bindings/sc-sha-python/pyproject.toml
      - name: Build sc-sha sdist
        run: maturin sdist --manifest-path bindings/sc-sha-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sc-sha-python-sdist
          path: dist/*.tar.gz

  publish-testpypi:
    # TestPyPI remains part of the non-production rehearsal. Production PyPI
    # publication is deliberately handled by pypi-publish.yml after the
    # immutable GitHub Release exists.
    if: ${{ needs.gate-and-tag.outputs.release_target == 'testpypi' }}
    needs: [gate-and-tag, build-python-wheels, build-python-sdist, build-sc-sha-python-wheels, build-sc-sha-python-sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*python-wheels-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sc-sha-python-sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: python -m pip install maturin==1.9.4
      - name: Assert both Python sdists are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ "${#sdists[@]}" -ne 2 ]]; then
            echo "expected exactly two sdists (sc-compose and sc-sha), found ${#sdists[@]}" >&2
            exit 1
          fi
      - name: Publish wheels and sdist to TestPyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          MATURIN_NON_INTERACTIVE: "1"
        run: maturin upload --repository testpypi --non-interactive --skip-existing dist/*.whl dist/*.tar.gz

  release:
    if: ${{ needs.gate-and-tag.outputs.release_target == 'production' }}
    needs: [gate-and-tag, build, publish, build-python-wheels, build-python-sdist, build-sc-sha-python-wheels, build-sc-sha-python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;
          find artifacts -type f -name '*.whl' -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          files=()
          for pattern in *.tar.gz *.zip *.whl; do
            for file in $pattern; do
              [[ -e "$file" ]] || continue
              files+=("$file")
            done
          done
          sha256sum "${files[@]}" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate-and-tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release/*
