name: Go Native Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ANC-023: full Go native build/install integration runs only by manual preflight.
  go-native-plan:
    name: Go native target plan
    runs-on: ubuntu-latest
    outputs:
      target_matrix: ${{ steps.matrix.outputs.target_matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        name: Read Go native target matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "target_matrix=$(python3 .github/scripts/go_native_module.py target-matrix --manifest release/publish-artifacts.toml --config release/go-native-module.toml)" >> "$GITHUB_OUTPUT"

  go-native-generated:
    name: Generate shared sc-sha Go bindings for manual matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Cache pinned UniFFI scaffolding generator
        id: uniffi-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen
          key: uniffi-cli-0.31.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned UniFFI scaffolding generator
        if: steps.uniffi-cli-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi --version '=0.31.2' --features cli --bin uniffi-bindgen --locked
      - name: Verify generated Rust scaffolding
        run: python3 scripts/generate_sc_sha_scaffolding.py --mode check
      - name: Cache generated Go bindings
        id: generated-cache
        uses: actions/cache@v6
        with:
          path: bindings/sc-sha-go/go
          key: uniffi-bindgen-go-generated-v0.7.1-v0.31.0-runtime-v0.31.2-${{ hashFiles('bindings/sc-sha-go/src/sc_sha_go.udl', 'bindings/sc-sha-go/uniffi.toml') }}
      - name: Generate bindings on Ubuntu when cache misses
        if: steps.generated-cache.outputs.cache-hit != 'true'
        run: |
          python3 .github/scripts/install_uniffi_bindgen_go.py
          uniffi-bindgen-go --out-dir bindings/sc-sha-go/go --config bindings/sc-sha-go/uniffi.toml bindings/sc-sha-go/src/sc_sha_go.udl
      - name: Test pinned UniFFI Go generator installer
        shell: bash
        run: cd .github/scripts && python3 -m unittest test_install_uniffi_bindgen_go -v
      - name: Verify generated bindings
        run: git diff --exit-code -- bindings/sc-sha-go/go
      - name: Upload generated Go bindings
        uses: actions/upload-artifact@v4
        with:
          name: sc-sha-go-generated
          path: bindings/sc-sha-go/go

  go-native-matrix:
    name: Go native integration (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [go-native-plan, go-native-generated]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.go-native-plan.outputs.target_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download generated Go bindings
        uses: actions/download-artifact@v4
        with:
          name: sc-sha-go-generated
          path: bindings/sc-sha-go/go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Build the target-native static adapter
        run: cargo build --release -p ${{ matrix.cargo_package }} --target ${{ matrix.target }}

      - name: Stage the self-contained Go module bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "from pathlib import Path; import tomllib; print(tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
          library="target/${{ matrix.target }}/release/${{ matrix.library }}"
          bundle="$RUNNER_TEMP/${{ matrix.artifact_prefix }}-${{ matrix.target }}"
          python3 .github/scripts/go_native_module.py stage \
            --config release/go-native-module.toml \
            --target '${{ matrix.target }}' \
            --native-library "$library" \
            --output "$bundle" \
            --version "$version"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run bundled Go conformance tests
        working-directory: ${{ steps.bundle.outputs.path }}
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Run an independent Go consumer module
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/sc-sha-go-consumer"
          cp -R bindings/sc-sha-go/tests/consumer-module "$consumer"
          cd "$consumer"
          module='${{ matrix.module }}'
          go mod edit -replace "$module=${{ steps.bundle.outputs.path }}"
          go get "$module/go/sc_sha_go@v${{ steps.bundle.outputs.version }}"
          CGO_ENABLED=1 go run .

      - name: Verify downloaded release bundle contract
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ steps.bundle.outputs.path }}"
          archive="$RUNNER_TEMP/${{ matrix.artifact_prefix }}-${{ matrix.target }}.zip"
          downloaded="$RUNNER_TEMP/${{ matrix.artifact_prefix }}-downloaded-${{ matrix.target }}"
          python3 - "$bundle" "$archive" "$downloaded/module" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source, archive, destination = map(Path, sys.argv[1:])
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for path in source.rglob("*"):
                  if path.is_file():
                      output.write(path, path.relative_to(source))
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as payload:
              payload.extractall(destination)
          PY
          (cd "$downloaded/module" && CGO_ENABLED=1 go test ./...)
          consumer="$RUNNER_TEMP/${{ matrix.artifact_prefix }}-downloaded-consumer-${{ matrix.target }}"
          cp -R bindings/sc-sha-go/tests/consumer-module "$consumer"
          cd "$consumer"
          module='${{ matrix.module }}'
          go mod edit -replace "$module=$downloaded/module"
          go get "$module/go/sc_sha_go@v${{ steps.bundle.outputs.version }}"
          CGO_ENABLED=1 go run .
