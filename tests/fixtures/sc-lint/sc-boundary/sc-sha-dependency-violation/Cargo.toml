[workspace]
members = [
    "crates/sc-sha",
    "crates/sc-composer",
    "crates/sc-compose",
    "crates/sc-compose-py",
    "crates/filesystem-support",
    "crates/cache-host",
    "crates/unrelated-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["sc-compose"]
license = "MIT"
repository = "https://example.invalid/sc-compose-sc-sha-boundary"
homepage = "https://example.invalid/sc-compose-sc-sha-boundary"
